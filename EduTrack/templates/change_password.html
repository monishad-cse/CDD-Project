{% extends "base.html" %}{% block content %}
<div class="row justify-content-center">
 <div class="col-md-6 col-lg-5">
  <div class="card card-body">
   <h2 class="mb-3">Change password</h2>
   <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
     <label class="form-label" for="current_password">Current password</label>
     <input class="form-control" id="current_password" name="current_password"
            type="password" autocomplete="current-password" required>
    </div>
    <div class="mb-3">
     <label class="form-label" for="new_password">New password</label>
     <input class="form-control" id="new_password" name="new_password" type="password"
            minlength="8" maxlength="128" autocomplete="new-password" required>
    </div>
    <div class="mb-3">
     <label class="form-label" for="confirm_password">Confirm new password</label>
     <input class="form-control" id="confirm_password" name="confirm_password"
            type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Update password</button>
   </form>
  </div>
 </div>
</div>
{% endblock %}
